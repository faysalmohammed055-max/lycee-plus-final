  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide && window.lucide.icons[name]) {
      ref.current.innerHTML = window.lucide.icons[name].toSvg({ width: size, height: size, "stroke-width": 2 });

  });
  return <span ref={ref} className={className} style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", lineHeight: 0, ...style }} />;

function buildCourses(cycle, niveau, matiere) {
  const key = (cycle === "Lycée" || cycle === "BTS") ? `${niveau}-${matiere}` : `${cycle}-${matiere}`;
  const chapitres = CHAPITRES[key] || [];
  const pattern = LESSON_PATTERNS[cycle];
  let counter = 0;
  return chapitres.map((titre, i) => ({
    id: `${key}-c${i}`,
    titre,
    numero: i + 1,
    lessons: pattern.map((l, j) => {
      const yid = YOUTUBE_IDS[counter % YOUTUBE_IDS.length];
      counter++;
      return { id: `${key}-c${i}-l${j}`, titre: l.suffix, duration: l.duration, youtubeId: yid };
    }),
  }));
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

  const [plan, setPlan] = useState(null);
  const [pendingPlan, setPendingPlan] = useState(null);
  const [paymentMethod, setPaymentMethod] = useState(null);
  const [paymentStatus, setPaymentStatus] = useState("idle");
  const [copiedAddress, setCopiedAddress] = useState(null);
  const [user, setUser] = useState(null);
  const [authMode, setAuthMode] = useState("connexion");
  const [authForm, setAuthForm] = useState({ nom: "", email: "", password: "" });
  const [authError, setAuthError] = useState("");
  const [authRedirect, setAuthRedirect] = useState("catalogue");
  const [accountMenuOpen, setAccountMenuOpen] = useState(false);
  const [profiles, setProfiles] = useState([]);
  const [activeProfileId, setActiveProfileId] = useState(null);
  const [newProfileName, setNewProfileName] = useState("");
  const googleButtonRef = useRef(null);
  const stampTimeoutRef = useRef(null);

  const niveaux = NIVEAUX_PAR_CYCLE[cycle];
  const matieres = getMatieres(cycle, niveau);
  const courses = useMemo(() => buildCourses(cycle, niveau, matiere), [cycle, niveau, matiere]);
  const course = courses.find((c) => c.id === courseId) || null;
  const lesson = course ? course.lessons.find((l) => l.id === lessonId) : null;
  const cfg = MATIERES_CONFIG[matiere];
  const completed = completedByProfile[activeProfileId] || new Set();
  const activeProfile = profiles.find((p) => p.id === activeProfileId) || null;
  const canHaveMultipleProfiles = subscribed && plan === "Premium";

  useEffect(() => {
    const newNiveau = NIVEAUX_PAR_CYCLE[cycle][0];
    setNiveau(newNiveau);
    setMatiere(getMatieres(cycle, newNiveau)[0]);
    setView("catalogue");
    setCourseId(null);
    setLessonId(null);
  }, [cycle]);

  useEffect(() => {
    setMatiere(getMatieres(cycle, niveau)[0]);
    setView("catalogue");
    setCourseId(null);
    setLessonId(null);
  }, [niveau]);

  useEffect(() => {
    setView("catalogue");
    setCourseId(null);
    setLessonId(null);
  }, [matiere]);

  function markCompleted(id) {
    setCompletedByProfile((prev) => {
      const next = { ...prev };
      const s = new Set(next[activeProfileId] || []);
      s.add(id);
      next[activeProfileId] = s;
      return next;
    });
    setStampVisible(true);
    clearTimeout(stampTimeoutRef.current);
    stampTimeoutRef.current = setTimeout(() => setStampVisible(false), 1300);
  }

  function openCourse(c) {
    if (isLocked(c)) { setView("pricing"); return; }
    setCourseId(c.id);
    const firstUnwatched = c.lessons.find((l) => !completed.has(l.id)) || c.lessons[0];
    setLessonId(firstUnwatched.id);
    setView("player");
  }

  function isLocked(c) { return c.numero > 1 && !subscribed; }

  function subscribeTo(p) {
    if (p.contact) return;
    if (!user) { setPendingPlan(p); openAuth("paiement"); return; }
    setPendingPlan(p);
    setPaymentMethod(null);
    setPaymentStatus("idle");
    setView("paiement");
  }

  function confirmPayment() {
    const method = ALL_PAYMENT_METHODS.find((m) => m.id === paymentMethod);
    if (!pendingPlan || !method || method.disabled) return;
    const smsNumber = "+22896493225";
    const dest = method.crypto ? `${method.address} (${method.network})` : method.number;
    const refLabel = method.crypto ? "le hash de la transaction" : "ma reference de transaction";
    const message = `Bonjour, je viens d'envoyer ${pendingPlan.price}${pendingPlan.period} pour l'abonnement ${pendingPlan.name} via ${method.name} à ${dest}. Voici ${refLabel} :`;
    window.open(`sms:${smsNumber}?body=${encodeURIComponent(message)}`, "_blank");
    setPaymentStatus("waiting");
  }

  function sendProofWhatsapp() {
    const method = ALL_PAYMENT_METHODS.find((m) => m.id === paymentMethod);
    if (!pendingPlan || !method || method.disabled) return;
    const whatsappNumber = "22893987301";
    const dest = method.crypto ? `${method.address} (${method.network})` : method.number;
    const refLabel = method.crypto ? "le hash de la transaction" : "ma preuve de paiement";
    const message = `Bonjour, je viens d'envoyer ${pendingPlan.price}${pendingPlan.period} pour l'abonnement ${pendingPlan.name} via ${method.name} à ${dest}. Voici ${refLabel} :`;
    window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, "_blank");
    setPaymentStatus("waiting");
  }

  function contactCardWhatsapp() {
    if (!pendingPlan) return;
    const whatsappNumber = "22893987301";
    const message = `Bonjour, je souhaite payer l'abonnement ${pendingPlan.name} (${pendingPlan.price}${pendingPlan.period}) par carte bancaire. Pouvez-vous m'indiquer la marche à suivre ?`;
    window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`, "_blank");
    setPaymentStatus("waiting");
  }

  function copyAddress(address) {
    if (navigator?.clipboard?.writeText) navigator.clipboard.writeText(address).catch(() => {});
    setCopiedAddress(address);
    setTimeout(() => setCopiedAddress((a) => (a === address ? null : a)), 1500);
  }

  function previewUnlockDemo() {
    if (!pendingPlan) return;
    setSubscribed(true);
    setPlan(pendingPlan.name);
    setPaymentStatus("success");
  }

  function finishPayment() {
    setPaymentStatus("idle");
    setPendingPlan(null);
    setPaymentMethod(null);
    setView("catalogue");
  }

  function cancelSubscription() { setSubscribed(false); setPlan(null); }
  function selectLesson(l) { setLessonId(l.id); }
  function courseProgress(c) {
    const done = c.lessons.filter((l) => completed.has(l.id)).length;
    return { done, total: c.lessons.length };
  }

  function openAuth(redirect = "catalogue") {
    setAuthRedirect(redirect);
    setAuthError("");
    setView("auth");
  }

  useEffect(() => {
    if (view !== "auth" || user || !GOOGLE_CLIENT_ID) return;
    const script = document.createElement("script");
    script.src = "https://accounts.google.com/gsi/client";
    script.async = true;
    script.defer = true;
    script.onload = () => {
      if (window.google && googleButtonRef.current) {
        window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
        window.google.accounts.id.renderButton(googleButtonRef.current, { theme: "outline", size: "large", width: 320 });
      }
    };
    document.body.appendChild(script);
    return () => { if (document.body.contains(script)) document.body.removeChild(script); };
  }, [view, user]);

  function handleGoogleCredential(response) {
    try {
      const payload = JSON.parse(atob(response.credential.split(".")[1]));
      initAccount(payload.given_name || payload.name || "Utilisateur", payload.email || "", "google");
      setView(authRedirect);
    } catch (e) {
      setAuthError("La connexion Google a échoué. Réessayez.");
    }
  }

  function initAccount(name, email, method) {
    setUser({ name, email, method });
    const primary = { id: "primary", name, color: PROFILE_COLORS[0] };
    setProfiles([primary]);
    setActiveProfileId("primary");
    setCompletedByProfile({ primary: new Set() });
  }

  function handleAuthSubmit(e) {
    e.preventDefault();
    if (!authForm.email.includes("@") || !authForm.email.includes(".")) {
      setAuthError("Merci d'indiquer une adresse email valide."); return;
    }
    if (!authForm.password || authForm.password.length < 4) {
      setAuthError("Le mot de passe doit contenir au moins 4 caractères."); return;
    }
    if (authMode === "inscription" && !authForm.nom.trim()) {
      setAuthError("Merci d'indiquer votre nom."); return;
    }
    const name = authMode === "inscription" ? authForm.nom.trim() : authForm.email.split("@")[0];
    initAccount(name, authForm.email, "email");
    setAuthError("");
    setAuthForm({ nom: "", email: "", password: "" });
    setView(authRedirect);
  }

  function logout() {
    setUser(null); setAccountMenuOpen(false); setSubscribed(false); setPlan(null);
    setProfiles([]); setActiveProfileId(null); setCompletedByProfile({}); setView("catalogue");
  }

  function switchProfile(id) {
    setActiveProfileId(id); setAccountMenuOpen(false); setView("catalogue"); setCourseId(null); setLessonId(null);
  }

  function addProfile() {
    if (!canHaveMultipleProfiles) return;
    const name = newProfileName.trim();
    if (!name) return;
    if (profiles.length >= MAX_PROFILES) return;
    const id = `profile-${Date.now()}`;
    const color = PROFILE_COLORS[profiles.length % PROFILE_COLORS.length];
    setProfiles((prev) => [...prev, { id, name, color }]);
    setCompletedByProfile((prev) => ({ ...prev, [id]: new Set() }));
    setNewProfileName("");
    setActiveProfileId(id);
  }

  return (
    <div className="min-h-screen w-full flex flex-col" style={{ background: "#FAF8F3", fontFamily: "'IBM Plex Sans', sans-serif", color: "#2E2C28" }}>
      <header className="flex flex-col gap-2 px-4 md:px-6 py-3" style={{ background: "#1B2A4A" }}>
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Icon name="GraduationCap" size={26} className="text-white" />
            <span className="font-display text-white text-xl tracking-tight">Lycée+</span>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setView("pricing")} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap"
              style={{ background: subscribed ? "rgba(244,197,66,0.18)" : "#F4C542", color: subscribed ? "#F4C542" : "#1B2A4A", border: subscribed ? "1px solid #F4C542" : "none" }}>
              <Icon name="Sparkles" size={14} />
              {subscribed ? plan : "Abonnement"}
            </button>
            {user ? (
              <div className="relative">
                <button onClick={() => setAccountMenuOpen((v) => !v)} className="flex items-center gap-1.5 pl-1 pr-2.5 py-1 rounded-full text-xs font-semibold whitespace-nowrap" style={{ background: "rgba(255,255,255,0.12)", color: "#EDEBE3" }}>
                  <span className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-bold" style={{ background: (activeProfile?.color) || "#F4C542", color: "#1B2A4A" }}>
                    {(activeProfile?.name || user.name).charAt(0).toUpperCase()}
                  </span>
                  <span className="hidden sm:inline">{activeProfile?.name || user.name}</span>
                </button>
                {accountMenuOpen && (
                  <div className="absolute right-0 top-full mt-2 w-56 bg-white rounded-lg border shadow-lg py-1 z-20" style={{ borderColor: "#E4DFD1" }}>
                    <div className="px-3 py-2 border-b" style={{ borderColor: "#E4DFD1" }}>
                      <p className="text-xs font-semibold truncate" style={{ color: "#1B2A4A" }}>{user.name}</p>
                      <p className="text-[11px] text-gray-400 truncate">{user.email}</p>
                    </div>
                    <button onClick={() => { setAccountMenuOpen(false); setView("profiles"); }} className="w-full flex items-center gap-2 px-3 py-2 text-xs text-left text-gray-600 hover:bg-gray-50">
                      <Icon name="Users" size={13} /> Gérer les profils
                    </button>
                    <button onClick={logout} className="w-full flex items-center gap-2 px-3 py-2 text-xs text-left text-gray-600 hover:bg-gray-50">
                      <Icon name="LogOut" size={13} /> Se déconnecter
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <button onClick={() => openAuth(view)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap" style={{ background: "rgba(255,255,255,0.12)", color: "#EDEBE3" }}>
                <Icon name="User" size={14} /> Se connecter
              </button>
            )}
          </div>
        </div>

        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {CYCLES.map((c) => (
            <button key={c} onClick={() => setCycle(c)} className="px-3.5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition-colors"
              style={{ background: cycle === c ? "#F4C542" : "rgba(255,255,255,0.10)", color: cycle === c ? "#1B2A4A" : "#EDEBE3" }}>
              {c}
            </button>
          ))}
        </div>

        <div className="flex gap-1.5 overflow-x-auto no-scrollbar">
          {niveaux.map((n) => (
            <button key={n} onClick={() => setNiveau(n)} className="px-3 py-1 rounded-md text-xs font-medium whitespace-nowrap font-mono"
              style={{ background: niveau === n ? "rgba(244,197,66,0.18)" : "transparent", color: niveau === n ? "#F4C542" : "#9AA6C4", border: niveau === n ? "1px solid #F4C542" : "1px solid rgba(255,255,255,0.15)" }}>
              {n}
            </button>
          ))}
        </div>
      </header>

      <div className="md:hidden flex gap-2 overflow-x-auto no-scrollbar px-4 py-3" style={{ background: "#22335A" }}>
        {matieres.map((m) => (
          <button key={m} onClick={() => setMatiere(m)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs whitespace-nowrap"
            style={{ background: matiere === m ? MATIERES_CONFIG[m].color : "rgba(255,255,255,0.08)", color: "#fff" }}>
            <Icon name={MATIERES_CONFIG[m].icon} size={14} /> {m}
          </button>
        ))}
      </div>

      <div className="flex flex-1 min-h-0">
        <aside className="hidden md:flex flex-col w-64 shrink-0 relative pt-6 pb-6 px-4" style={{ background: "#1B2A4A" }}>
          {[18, 42, 66].map((top) => (
            <div key={top} className="absolute -left-2 w-4 h-4 rounded-full hole" style={{ top: `${top}%`, background: "#FAF8F3" }} />
          ))}
          <p className="font-mono text-[11px] uppercase tracking-widest mb-3 pl-2" style={{ color: "#8FA0C4" }}>Matières · {niveau}</p>
          <div className="flex flex-col gap-1">
            {matieres.map((m) => {
              const active = matiere === m;
              return (
                <button key={m} onClick={() => setMatiere(m)} className="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-medium text-left transition-colors"
                  style={{ background: active ? "rgba(244,197,66,0.14)" : "transparent", color: active ? "#F4C542" : "#D9DEEA", borderLeft: active ? `3px solid ${MATIERES_CONFIG[m].color}` : "3px solid transparent" }}>
                  <Icon name={MATIERES_CONFIG[m].icon} size={18} />
                  {m}
                </button>
              );
            })}
          </div>
        </aside>

        <main className="flex-1 min-w-0 paper-grid overflow-y-auto">
          {view === "catalogue" && (
            <div className="p-5 md:p-8 max-w-4xl mx-auto">
              <div className="flex items-center gap-3 mb-1">
                <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background: cfg.color }}>
                  <Icon name={cfg.icon} size={22} className="text-white" />
                </div>
                <div>
                  <h1 className="font-display text-2xl leading-tight" style={{ color: "#1B2A4A" }}>{matiere}</h1>
                  <p className="text-sm text-gray-500 font-mono">{cycle} · {niveau} · {cfg.prof}</p>
                </div>
              </div>
              {activeProfile && (
                <button onClick={() => setView("profiles")} className="inline-flex items-center gap-1.5 pl-1 pr-3 py-1 rounded-full text-xs font-semibold mb-2 border"
                  style={{ background: `${activeProfile.color}14`, borderColor: `${activeProfile.color}55`, color: activeProfile.color }}>
                  <span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{ background: activeProfile.color }}>{activeProfile.name.charAt(0).toUpperCase()}</span>
                  Profil actif · {activeProfile.name}
                </button>
              )}
              <p className="text-sm text-gray-500 mt-2 mb-4">{courses.length} chapitres disponibles</p>

              <div className="flex flex-col gap-3">
                {courses.length === 0 && <p className="text-sm text-gray-400 italic">Aucun chapitre pour cette combinaison pour le moment.</p>}
                {courses.map((c) => {
                  const { done, total } = courseProgress(c);
                  const totalDuration = c.lessons.reduce((a, l) => a + l.duration, 0);
                  const locked = isLocked(c);
                  return (
                    <button key={c.id} onClick={() => openCourse(c)} className="text-left bg-white rounded-xl border p-4 md:p-5 flex items-center gap-4 hover:shadow-md transition-shadow" style={{ borderColor: "#E4DFD1", opacity: locked ? 0.72 : 1 }}>
                      <div className="font-mono text-xs px-2.5 py-1 rounded-md shrink-0" style={{ background: `${cfg.color}1A`, color: cfg.color }}>Ch. {c.numero}</div>
                      <div className="flex-1 min-w-0">
                        <h2 className="font-display text-lg leading-snug flex items-center gap-2" style={{ color: "#1B2A4A" }}>
                          {c.titre}
                          {locked && (
                            <span className="flex items-center gap-1 text-[10px] font-mono font-semibold uppercase px-1.5 py-0.5 rounded" style={{ background: "#F4C54233", color: "#8A6A1E" }}>
                              <Icon name="Lock" size={10} /> Premium
                            </span>
                          )}
                        </h2>
                        <div className="flex items-center gap-3 mt-1 text-xs text-gray-500 font-mono">
                          <span className="flex items-center gap-1"><Icon name="Clock" size={12} /> {fmtTime(totalDuration)}</span>
                          <span>{total} leçons</span>
                          {done > 0 && <span className="flex items-center gap-1" style={{ color: cfg.color }}><Icon name="CheckCircle2" size={12} /> {done}/{total} vues</span>}
                        </div>
                      </div>
                      {locked ? <Icon name="Lock" className="text-gray-300 shrink-0" size={18} /> : <Icon name="ChevronRight" className="text-gray-300 shrink-0" size={20} />}
                    </button>
                  );
                })}
              </div>

              {!subscribed && (
                <button onClick={() => setView("pricing")} className="mt-5 w-full flex items-center justify-center gap-2 rounded-xl py-3 text-sm font-semibold" style={{ background: "#1B2A4A", color: "#F4C542" }}>
                  <Icon name="Sparkles" size={16} /> Débloquer tous les chapitres
                </button>
              )}
            </div>
          )}

          {view === "pricing" && (
            <div className="p-5 md:p-8 max-w-5xl mx-auto">
              <div className="flex items-center justify-between mb-1">
                <div>
                  <h1 className="font-display text-2xl" style={{ color: "#1B2A4A" }}>Choisissez votre abonnement</h1>
                  <p className="text-sm text-gray-500 mt-1">Accédez à l'ensemble des chapitres, de la maternelle au BTS.</p>
                </div>
                <button onClick={() => setView("catalogue")} className="text-gray-400 hover:text-gray-600 shrink-0" aria-label="Fermer"><Icon name="X" size={22} /></button>
              </div>

              {subscribed && (
                <div className="mt-4 flex items-center justify-between bg-white border rounded-xl px-4 py-3" style={{ borderColor: "#E4DFD1" }}>
                  <p className="text-sm" style={{ color: "#1B2A4A" }}>Vous êtes actuellement abonné·e au plan <strong>{plan}</strong>.</p>
                  <button onClick={cancelSubscription} className="text-xs font-mono underline text-gray-500">Résilier</button>
                </div>
              )}

              <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                {PLANS.map((p) => {
                  const isCurrent = subscribed ? plan === p.name : p.id === "gratuit";
                  return (
                    <div key={p.id} className="rounded-xl border p-5 flex flex-col bg-white" style={{ borderColor: p.highlight ? "#F4C542" : "#E4DFD1", borderWidth: p.highlight ? 2 : 1 }}>
                      {p.highlight && <span className="self-start text-[10px] font-mono font-semibold uppercase px-2 py-0.5 rounded-full mb-2" style={{ background: "#F4C542", color: "#1B2A4A" }}>Recommandé</span>}
                      <h2 className="font-display text-xl" style={{ color: "#1B2A4A" }}>{p.name}</h2>
                      <p className="text-xs text-gray-500 mt-0.5">{p.tagline}</p>
                      <p className="font-mono text-2xl mt-3" style={{ color: "#1B2A4A" }}>{p.price} <span className="text-xs text-gray-400 font-sans">{p.period}</span></p>
                      <ul className="flex flex-col gap-2 mt-4 mb-5 flex-1">
                        {p.features.map((f) => (
                          <li key={f} className="flex items-start gap-2 text-sm text-gray-600">
                            <Icon name="Check" size={15} className="shrink-0 mt-0.5" style={{ color: "#2F6F4E" }} />
                            {f}
                          </li>
                        ))}
                      </ul>
                      <button onClick={() => subscribeTo(p)} disabled={isCurrent} className="w-full py-2.5 rounded-lg text-sm font-semibold"
                        style={{ background: isCurrent ? "#EFEBE0" : p.contact ? "#1B2A4A" : "#F4C542", color: isCurrent ? "#9A9585" : p.contact ? "#F4C542" : "#1B2A4A", cursor: isCurrent ? "default" : "pointer" }}>
                        {isCurrent ? "Plan actuel" : p.contact ? "Nous contacter" : "Choisir ce plan"}
                      </button>
                      {p.contact && (
                        <div className="flex flex-col gap-1.5 mt-2">
                          <a href="https://wa.me/22893987301" target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 text-xs font-mono" style={{ color: "#2E7D6B" }}>
                            <Icon name="MessageCircle" size={13} /> WhatsApp · {p.contactPhone}
                          </a>
                          <a href={`tel:${p.contactPhone2.replace(/\s/g, "")}`} className="flex items-center justify-center gap-1.5 text-xs font-mono" style={{ color: "#1B2A4A" }}>
                            <Icon name="Phone" size={13} /> {p.contactPhone2}
                          </a>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {view === "auth" && (
            <div className="p-5 md:p-8 max-w-md mx-auto">
              <button onClick={() => setView("catalogue")} className="flex items-center gap-1 text-sm font-medium mb-4" style={{ color: "#1B2A4A" }}>
                <Icon name="ChevronLeft" size={16} /> Retour
              </button>
              <div className="bg-white rounded-xl border p-6" style={{ borderColor: "#E4DFD1" }}>
                <div className="flex items-center gap-2 mb-1">
                  <Icon name="GraduationCap" size={20} style={{ color: "#1B2A4A" }} />
                  <h1 className="font-display text-xl" style={{ color: "#1B2A4A" }}>{authMode === "connexion" ? "Content de vous revoir" : "Créer un compte"}</h1>
                </div>
                <p className="text-sm text-gray-500 mb-5">{authMode === "connexion" ? "Connectez-vous pour accéder à votre progression." : "Rejoignez Lycée+ en quelques secondes."}</p>

                <div className="flex flex-col items-center mb-4 min-h-[44px]">
                  <div ref={googleButtonRef} />
                </div>

                <div className="flex items-center gap-3 mb-4">
                  <div className="h-px flex-1" style={{ background: "#E4DFD1" }} />
                  <span className="text-[11px] font-mono text-gray-400">OU</span>
                  <div className="h-px flex-1" style={{ background: "#E4DFD1" }} />
                </div>

                <div className="flex flex-col gap-3">
                  {authMode === "inscription" && (
                    <input type="text" placeholder="Nom complet" value={authForm.nom} onChange={(e) => setAuthForm((f) => ({ ...f, nom: e.target.value }))}
                      onKeyDown={(e) => { if (e.key === "Enter") handleAuthSubmit(e); }} className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none" style={{ borderColor: "#E4DFD1" }} />
                  )}
                  <input type="email" placeholder="Adresse email" value={authForm.email} onChange={(e) => setAuthForm((f) => ({ ...f, email: e.target.value }))}
                    onKeyDown={(e) => { if (e.key === "Enter") handleAuthSubmit(e); }} className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none" style={{ borderColor: "#E4DFD1" }} />
                  <input type="password" placeholder="Mot de passe" value={authForm.password} onChange={(e) => setAuthForm((f) => ({ ...f, password: e.target.value }))}
                    onKeyDown={(e) => { if (e.key === "Enter") handleAuthSubmit(e); }} className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none" style={{ borderColor: "#E4DFD1" }} />
                  {authError && <p className="text-xs" style={{ color: "#C1443C" }}>{authError}</p>}
                  <button type="button" onClick={handleAuthSubmit} className="w-full py-2.5 rounded-lg text-sm font-semibold mt-1" style={{ background: "#F4C542", color: "#1B2A4A" }}>
                    {authMode === "connexion" ? "Se connecter" : "Créer mon compte"}
                  </button>
                </div>

                <p className="text-xs text-gray-500 text-center mt-4">
                  {authMode === "connexion" ? "Pas encore de compte ?" : "Déjà un compte ?"}{" "}
                  <button onClick={() => { setAuthMode((m) => (m === "connexion" ? "inscription" : "connexion")); setAuthError(""); }} className="font-semibold underline" style={{ color: "#1B2A4A" }}>
                    {authMode === "connexion" ? "S'inscrire" : "Se connecter"}
                  </button>
                </p>
              </div>
            </div>
          )}

          {view === "profiles" && user && (
            <div className="p-5 md:p-8 max-w-2xl mx-auto">
              <button onClick={() => setView("catalogue")} className="flex items-center gap-1 text-sm font-medium mb-4" style={{ color: "#1B2A4A" }}>
                <Icon name="ChevronLeft" size={16} /> Retour
              </button>
              <div className="flex items-center gap-2 mb-1">
                <Icon name="Users" size={20} style={{ color: "#1B2A4A" }} />
                <h1 className="font-display text-2xl" style={{ color: "#1B2A4A" }}>Profils élèves</h1>
              </div>
              <p className="text-sm text-gray-500 mb-6">Chaque profil garde sa propre progression, idéal pour toute la famille.</p>

              <div className="grid sm:grid-cols-2 gap-3">
                {profiles.map((p) => {
                  const isActive = p.id === activeProfileId;
                  const doneCount = (completedByProfile[p.id] || new Set()).size;
                  return (
                    <button key={p.id} onClick={() => switchProfile(p.id)} className="flex items-center gap-3 bg-white rounded-xl border p-4 text-left" style={{ borderColor: isActive ? p.color : "#E4DFD1", borderWidth: isActive ? 2 : 1 }}>
                      <span className="w-10 h-10 rounded-full flex items-center justify-center text-white text-sm font-bold shrink-0" style={{ background: p.color }}>{p.name.charAt(0).toUpperCase()}</span>
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-semibold truncate" style={{ color: "#1B2A4A" }}>{p.name}</p>
                        <p className="text-xs text-gray-400 font-mono">{doneCount} leçon{doneCount > 1 ? "s" : ""} vue{doneCount > 1 ? "s" : ""}</p>
                      </div>
                      {isActive && <Icon name="CheckCircle2" size={18} style={{ color: p.color }} className="shrink-0" />}
                    </button>
                  );
                })}
              </div>

              {canHaveMultipleProfiles ? (
                profiles.length < MAX_PROFILES ? (
                  <div className="mt-5 bg-white rounded-xl border p-4" style={{ borderColor: "#E4DFD1" }}>
                    <p className="text-xs font-mono uppercase tracking-wider text-gray-400 mb-2">Ajouter un profil ({profiles.length}/{MAX_PROFILES})</p>
                    <div className="flex gap-2">
                      <input type="text" placeholder="Prénom de l'enfant" value={newProfileName} onChange={(e) => setNewProfileName(e.target.value)}
                        onKeyDown={(e) => { if (e.key === "Enter") addProfile(); }} className="flex-1 px-3 py-2 rounded-lg border text-sm outline-none" style={{ borderColor: "#E4DFD1" }} />
                      <button onClick={addProfile} disabled={!newProfileName.trim()} className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-semibold shrink-0"
                        style={{ background: newProfileName.trim() ? "#F4C542" : "#EFEBE0", color: newProfileName.trim() ? "#1B2A4A" : "#9A9585" }}>
                        <Icon name="UserPlus" size={15} /> Ajouter
                      </button>
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-gray-400 mt-4 text-center">Limite de {MAX_PROFILES} profils atteinte.</p>
                )
              ) : (
                <div className="mt-5 bg-white rounded-xl border p-4 flex items-center justify-between gap-3" style={{ borderColor: "#E4DFD1" }}>
                  <div className="flex items-center gap-2">
                    <Icon name="Lock" size={16} className="text-gray-400 shrink-0" />
                    <p className="text-xs text-gray-500">Le plan <strong>Premium</strong> permet d'ajouter jusqu'à {MAX_PROFILES} profils enfants.</p>
                  </div>
                  <button onClick={() => setView("pricing")} className="text-xs font-semibold px-3 py-1.5 rounded-full shrink-0" style={{ background: "#1B2A4A", color: "#F4C542" }}>Voir Premium</button>
                </div>
              )}
            </div>
          )}

          {view === "paiement" && pendingPlan && paymentStatus === "success" && (
            <div className="p-5 md:p-8 max-w-md mx-auto">
              <div className="bg-white rounded-xl border p-6 flex flex-col items-center text-center" style={{ borderColor: "#E4DFD1" }}>
                <div className="w-14 h-14 rounded-full flex items-center justify-center mb-3" style={{ background: "#2F6F4E1A" }}>
                  <Icon name="CheckCircle2" size={30} style={{ color: "#2F6F4E" }} />
                </div>
                <h1 className="font-display text-xl" style={{ color: "#1B2A4A" }}>Paiement réussi</h1>
                <p className="text-sm text-gray-500 mt-1">
                  Plan <strong>{pendingPlan.name}</strong> · {pendingPlan.price}{pendingPlan.period} via {ALL_PAYMENT_METHODS.find((m) => m.id === paymentMethod)?.name || "démo"}
                </p>
                <p className="text-xs text-gray-400 font-mono mt-3">Réf. LYCEEPLUS-{Date.now().toString().slice(-8)}</p>
                <button onClick={finishPayment} className="w-full mt-6 py-3 rounded-xl text-sm font-semibold" style={{ background: "#F4C542", color: "#1B2A4A" }}>Accéder à mes cours</button>
              </div>
            </div>
          )}

          {view === "paiement" && pendingPlan && paymentStatus !== "success" && (
            <div className="p-5 md:p-8 max-w-md mx-auto">
              <button onClick={() => setView("pricing")} className="flex items-center gap-1 text-sm font-medium mb-4" style={{ color: "#1B2A4A" }}>
                <Icon name="ChevronLeft" size={16} /> Retour aux plans
              </button>
              <div className="bg-white rounded-xl border p-5" style={{ borderColor: "#E4DFD1" }}>
                <p className="text-xs font-mono uppercase tracking-wider text-gray-400">Récapitulatif</p>
                <div className="flex items-baseline justify-between mt-1">
                  <h1 className="font-display text-xl" style={{ color: "#1B2A4A" }}>Plan {pendingPlan.name}</h1>
                  <p className="font-mono text-lg" style={{ color: "#1B2A4A" }}>{pendingPlan.price}<span className="text-xs text-gray-400">{pendingPlan.period}</span></p>
                </div>

                <p className="text-xs font-mono uppercase tracking-wider text-gray-400 mt-6 mb-2">Moyen de paiement local</p>
                <div className="grid grid-cols-2 gap-2.5">
                  {LOCAL_METHODS.map((m) => {
                    const active = paymentMethod === m.id;
                    return (
                      <button key={m.id} onClick={() => !m.disabled && setPaymentMethod(m.id)} disabled={m.disabled} className="relative flex flex-col items-center gap-1.5 rounded-xl border p-3 text-xs font-medium"
                        style={{ borderColor: active ? m.color : "#E4DFD1", borderWidth: active ? 2 : 1, background: active ? `${m.color}0F` : "white", opacity: m.disabled ? 0.45 : 1, cursor: m.disabled ? "not-allowed" : "pointer" }}>
                        <Icon name={m.icon} size={20} style={{ color: m.color }} />
                        <span style={{ color: "#1B2A4A" }}>{m.name}</span>
                        {m.disabled && <span className="absolute -top-2 left-1/2 -translate-x-1/2 text-[9px] font-mono px-1.5 py-0.5 rounded-full whitespace-nowrap" style={{ background: "#1B2A4A", color: "#fff" }}>Bientôt</span>}
                      </button>
                    );
                  })}
                </div>

                <p className="text-xs font-mono uppercase tracking-wider text-gray-400 mt-5 mb-2">Cryptomonnaie</p>
                <div className="grid grid-cols-2 gap-2.5">
                  {CRYPTO_METHODS.map((m) => {
                    const active = paymentMethod === m.id;
                    return (
                      <button key={m.id} onClick={() => setPaymentMethod(m.id)} className="flex flex-col items-center gap-1.5 rounded-xl border p-3 text-xs font-medium"
                        style={{ borderColor: active ? m.color : "#E4DFD1", borderWidth: active ? 2 : 1, background: active ? `${m.color}0F` : "white" }}>
                        <Icon name={m.icon} size={20} style={{ color: m.color }} />
                        <span style={{ color: "#1B2A4A" }}>{m.name}</span>
                      </button>
                    );
                  })}
                </div>

                {paymentMethod && (() => {
                  const method = ALL_PAYMENT_METHODS.find((m) => m.id === paymentMethod);
                  if (!method) return null;
                  if (method.contactOnly) {
                    return (
                      <div className="mt-5 rounded-xl p-4" style={{ background: `${method.color}0D`, border: `1px solid ${method.color}33` }}>
                        <p className="text-sm font-medium" style={{ color: "#1B2A4A" }}>
                          Le paiement par carte bancaire se fait pour l'instant directement avec nous : contactez-nous sur WhatsApp pour organiser votre paiement en toute sécurité.
                        </p>
                      </div>
                    );
                  }
                  if (method.crypto) {
                    return (
                      <div className="mt-5 rounded-xl p-4" style={{ background: `${method.color}0D`, border: `1px solid ${method.color}33` }}>
                        <p className="text-sm font-medium" style={{ color: "#1B2A4A" }}>
                          1. Envoyez l'équivalent de <strong>{pendingPlan.price}{pendingPlan.period}</strong> en {method.name}, sur le réseau <strong>{method.network}</strong>, à cette adresse :
                        </p>
                        <div className="flex items-center gap-2 mt-2 bg-white rounded-lg border px-3 py-2" style={{ borderColor: "#E4DFD1" }}>
                          <code className="font-mono text-xs break-all flex-1" style={{ color: "#1B2A4A" }}>{method.address}</code>
                          <button onClick={() => copyAddress(method.address)} className="shrink-0" style={{ color: method.color }} aria-label="Copier l'adresse">
                            <Icon name={copiedAddress === method.address ? "Check" : "Copy"} size={16} />
                          </button>
                        </div>
                        <p className="text-sm font-medium mt-3" style={{ color: "#1B2A4A" }}>2. Envoyez-nous le hash (l'identifiant) de la transaction par SMS ou WhatsApp pour activer votre compte.</p>
                        <p className="text-[11px] mt-2" style={{ color: "#8A6A1E" }}>⚠️ Vérifiez bien que vous envoyez sur le réseau <strong>{method.network}</strong> — un envoi sur le mauvais réseau est irrécupérable.</p>
                      </div>
                    );
                  }
                  return (
                    <div className="mt-5 rounded-xl p-4" style={{ background: `${method.color}0D`, border: `1px solid ${method.color}33` }}>
                      <p className="text-sm font-medium" style={{ color: "#1B2A4A" }}>1. Envoyez <strong>{pendingPlan.price}{pendingPlan.period}</strong> via {method.name} au :</p>
                      <a href={`tel:${method.number.replace(/\s/g, "")}`} className="font-mono text-lg font-semibold mt-1 block" style={{ color: method.color }}>{method.number}</a>
                      {method.number2 && (
                        <>
                          <p className="text-xs text-gray-500 mt-1.5">ou</p>
                          <a href={`tel:${method.number2.replace(/\s/g, "")}`} className="font-mono text-lg font-semibold mt-0.5 block" style={{ color: method.color }}>{method.number2}</a>
                        </>
                      )}
                      <p className="text-sm font-medium mt-3" style={{ color: "#1B2A4A" }}>2. Envoyez-nous la référence de transaction par SMS, ou votre capture d'écran par WhatsApp, pour activer votre compte.</p>
                    </div>
                  );
                })()}

                {paymentMethod === "carte" ? (
                  <button onClick={contactCardWhatsapp} className="w-full mt-4 py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2" style={{ background: "#25D366", color: "#fff" }}>
                    <Icon name="MessageCircle" size={16} /> Contacter sur WhatsApp
                  </button>
                ) : (
                  <div className="grid grid-cols-2 gap-2.5 mt-4">
                    <button onClick={confirmPayment} disabled={!paymentMethod} className="py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5"
                      style={{ background: paymentMethod ? "#1B2A4A" : "#EFEBE0", color: paymentMethod ? "#fff" : "#9A9585", cursor: paymentMethod ? "pointer" : "not-allowed" }}>
                      <Icon name="MessageCircle" size={16} /> SMS
                    </button>
                    <button onClick={sendProofWhatsapp} disabled={!paymentMethod} className="py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5"
                      style={{ background: paymentMethod ? "#25D366" : "#EFEBE0", color: paymentMethod ? "#fff" : "#9A9585", cursor: paymentMethod ? "pointer" : "not-allowed" }}>
                      <Icon name="MessageCircle" size={16} /> WhatsApp
                    </button>
                  </div>
                )}
                {!paymentMethod && <p className="text-center text-xs text-gray-400 mt-2">Choisissez un moyen de paiement</p>}

                {paymentStatus === "waiting" && (
                  <div className="mt-4 rounded-lg px-3 py-2.5 text-xs" style={{ background: "#F4C54222", color: "#8A6A1E" }}>
                    En attente de vérification. Votre abonnement <strong>{pendingPlan.name}</strong> sera activé dès réception de votre paiement, généralement sous quelques minutes.
                  </div>
                )}

                <button onClick={previewUnlockDemo} className="w-full mt-3 text-xs font-mono underline text-gray-400">Aperçu du contenu débloqué (démo, sans paiement réel)</button>
                <p className="text-[11px] text-gray-400 text-center mt-3">Orange Money arrive bientôt, dès l'intégration CinetPay.</p>
              </div>
            </div>
          )}

          {view === "player" && course && lesson && !isLocked(course) && (
            <div className="p-4 md:p-8 max-w-5xl mx-auto">
              <button onClick={() => setView("catalogue")} className="flex items-center gap-1 text-sm font-medium mb-4" style={{ color: "#1B2A4A" }}>
                <Icon name="ChevronLeft" size={16} /> Retour au catalogue
              </button>

              <div className="grid md:grid-cols-[1fr_280px] gap-5">
                <div>
                  <div className="relative rounded-xl overflow-hidden" style={{ aspectRatio: "16/9", background: "#000" }}>
                    <iframe key={lesson.id} className="w-full h-full" src={`https://www.youtube.com/embed/${lesson.youtubeId}?rel=0`} title={lesson.titre} frameBorder="0"
                      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
                    {stampVisible && (
                      <div className="stamp-anim absolute top-4 right-4 border-4 rounded-lg px-3 py-1 font-display font-bold text-lg pointer-events-none z-10" style={{ borderColor: "#C1443C", color: "#C1443C", background: "rgba(255,255,255,0.9)" }}>VU ✓</div>
                    )}
                  </div>

                  <div className="flex items-center justify-between mt-3">
                    <span className="flex items-center gap-1 text-xs text-gray-500 font-mono"><Icon name="Clock" size={12} /> {fmtTime(lesson.duration)} environ</span>
                    <button onClick={() => markCompleted(lesson.id)} disabled={completed.has(lesson.id)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold"
                      style={{ background: completed.has(lesson.id) ? "rgba(47,111,78,0.12)" : cfg.color, color: completed.has(lesson.id) ? "#2F6F4E" : "#fff", cursor: completed.has(lesson.id) ? "default" : "pointer" }}>
                      <Icon name="CheckCircle2" size={14} />
                      {completed.has(lesson.id) ? "Leçon vue" : "Marquer comme vue"}
                    </button>
                  </div>

                  <div className="mt-4">
                    <p className="font-mono text-xs uppercase tracking-wider" style={{ color: cfg.color }}>{matiere} · Chapitre {course.numero}</p>
                    <h1 className="font-display text-2xl mt-1" style={{ color: "#1B2A4A" }}>{course.titre}</h1>
                    <p className="text-sm text-gray-500 mt-1">{lesson.titre} — {cfg.prof}</p>
                    {activeProfile && (
                      <button onClick={() => setView("profiles")} className="inline-flex items-center gap-1.5 pl-1 pr-3 py-1 rounded-full text-xs font-semibold mt-3 border"
                        style={{ background: `${activeProfile.color}14`, borderColor: `${activeProfile.color}55`, color: activeProfile.color }}>
                        <span className="w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold" style={{ background: activeProfile.color }}>{activeProfile.name.charAt(0).toUpperCase()}</span>
                        Profil actif · {activeProfile.name}
                      </button>
                    )}
                  </div>
                </div>

                <div className="bg-white rounded-xl border p-3 h-fit" style={{ borderColor: "#E4DFD1" }}>
                  <p className="font-mono text-[11px] uppercase tracking-widest text-gray-400 px-2 pb-2">Sommaire</p>
                  <div className="flex flex-col gap-1">
                    {course.lessons.map((l) => {
                      const isDone = completed.has(l.id);
                      const isActive = l.id === lessonId;
                      return (
                        <button key={l.id} onClick={() => selectLesson(l)} className="flex items-center gap-2 px-2.5 py-2 rounded-lg text-left text-sm" style={{ background: isActive ? `${cfg.color}14` : "transparent" }}>
                          {isDone ? <Icon name="CheckCircle2" size={16} style={{ color: cfg.color }} /> : <Icon name="Circle" size={16} className="text-gray-300" />}
                          <span className="flex-1 min-w-0 truncate" style={{ color: isActive ? "#1B2A4A" : "#4B4A45", fontWeight: isActive ? 600 : 400 }}>{l.titre}</span>
                          <span className="font-mono text-[11px] text-gray-400 shrink-0">{fmtTime(l.duration)}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}
        </main>
      </div>

      <footer className="px-4 md:px-6 py-2.5 flex flex-wrap items-center justify-center gap-x-4 gap-y-1" style={{ background: "#1B2A4A" }}>
        <a href="https://wa.me/22893987301" target="_blank" rel="noopener noreferrer" className="flex items-center gap-1.5 text-xs font-mono" style={{ color: "#F4C542" }}>
          <Icon name="MessageCircle" size={13} /> WhatsApp : +228 93 98 73 01
        </a>
        <a href="tel:+22896493225" className="flex items-center gap-1.5 text-xs font-mono" style={{ color: "#9AA6C4" }}>
          <Icon name="Phone" size={13} /> +228 96 49 32 25
        </a>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LyceePlus />);
</script>
</body>
</html>
